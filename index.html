<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rufzeichenregister | Amateurfunk</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f7fa;
      --surface: #fff;
      --ink: #182637;
      --muted: #4a5d72;
      --line: #ccd8e5;
      --accent: #005ca9;
      --accent-soft: #e4effa;
      --header: #00539a;
      --mono: Consolas, 'Courier New', monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.5 'Segoe UI', sans-serif; }
    header { background: var(--header); color: white; border-bottom: 4px solid #77b9ee; }
    .wrap { width: min(100% - 2rem, 69rem); margin-inline: auto; }
    .masthead { display: flex; justify-content: space-between; align-items: center; gap: .75rem; padding-block: .9rem; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: .65rem; font-weight: 650; }
    .brand svg { color: #cae7ff; }
    .edition { color: #e3f1ff; font: .82rem var(--mono); }
    main { padding-block: 2rem; }
    h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 .4rem; overflow-wrap: anywhere; }
    .intro, footer { color: var(--muted); margin: 0; }
    .search { margin-block: 1.5rem; }
    .search label { font-weight: 650; display: block; margin-bottom: .35rem; }
    .input-box { display: flex; align-items: center; gap: .65rem; min-height: 3.2rem; padding-inline: .85rem; border: 1px solid #829bb6; border-radius: 6px; background: var(--surface); }
    .input-box svg { flex: none; color: var(--accent); }
    input { width: 100%; min-width: 0; min-height: 3rem; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; }
    input:focus { outline: none; }
    .input-box:focus-within, :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .modes { display: flex; flex-wrap: wrap; gap: .35rem; padding: 0; margin: .75rem 0 0; border: 0; min-width: 0; }
    .modes label { position: relative; margin: 0; cursor: pointer; }
    .modes input { position: absolute; width: 1px; min-height: 0; height: 1px; opacity: 0; }
    .modes span { display: block; padding: .3rem .65rem; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); font-size: .9rem; }
    .modes input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .modes input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .results-head, .pagination { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .65rem; }
    .results-head { padding-block: .6rem; border-top: 1px solid var(--line); }
    h2 { font-size: 1.13rem; margin: 0; }
    #status, #page-label { color: var(--muted); font-size: .9rem; }
    .table-wrap { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; text-align: left; }
    col.call { width: 18%; }
    col.licence { width: 9%; }
    col.name { width: 34%; }
    th, td { padding: .65rem .85rem; vertical-align: top; overflow-wrap: anywhere; }
    thead { background: #e9f0f8; color: #25486d; font-size: .87rem; }
    td { border-top: 1px solid var(--line); }
    tbody tr:nth-child(even) { background: #f7faff; }
    a { color: var(--accent); text-underline-offset: .15em; }
    td a { font: 700 .98rem var(--mono); }
    td:nth-child(2) { font-family: var(--mono); }
    .no-place { color: var(--muted); }
    #empty { margin: 0; padding: 1.2rem .85rem; }
    .pagination { padding: .8rem 0; }
    .page-actions { display: flex; gap: .4rem; }
    button { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--accent); cursor: pointer; }
    button:not(:disabled):hover { background: var(--accent-soft); border-color: var(--accent); }
    button:disabled { color: var(--muted); opacity: .48; cursor: default; }
    footer { border-top: 1px solid var(--line); padding-top: .8rem; font-size: .85rem; }
    [hidden] { display: none !important; }
    @media (max-width: 35rem) {
      main { padding-block: 1.4rem; }
      h1 { font-size: 1.65rem; }
      th, td { padding: .5rem .3rem; font-size: .88rem; }
      td a { font-size: .84rem; }
      col.call { width: 24%; }
      col.licence { width: 12%; }
      col.name { width: 31%; }
    }
  </style>
  <script defer src="rufzeichen-daten.js"></script>
</head>
<body>
  <header>
    <div class="wrap masthead">
      <div class="brand">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.24 7.76a6 6 0 0 1 0 8.48M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14M7.76 16.24a6 6 0 0 1 0-8.48"/><circle cx="12" cy="12" r="2"/></svg>
        Amateurfunk / Deutschland
      </div>
      <span class="edition" id="edition">Lokales Register</span>
    </div>
  </header>
  <main class="wrap">
    <h1>Rufzeichenregister</h1>
    <p class="intro" id="overview">Rufzeichenliste der Bundesnetzagentur</p>
    <noscript><p>JavaScript ist f&uuml;r die lokale Suche erforderlich.</p></noscript>
    <form class="search" role="search" id="search" hidden>
      <label for="query">Suche</label>
      <div class="input-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="query" type="search" placeholder="Rufzeichen, Name, Ort oder PLZ" autocomplete="off" spellcheck="false">
      </div>
      <fieldset class="modes" aria-label="Suchfeld">
        <label><input type="radio" name="mode" value="all" checked><span>Alle Felder</span></label>
        <label><input type="radio" name="mode" value="call"><span>Rufzeichen</span></label>
        <label><input type="radio" name="mode" value="name"><span>Name</span></label>
        <label><input type="radio" name="mode" value="place"><span>Ort / PLZ</span></label>
      </fieldset>
    </form>
    <section id="results-section" aria-labelledby="results-title">
      <div class="results-head"><h2 id="results-title">Ergebnisse</h2><span id="status" role="status" aria-atomic="true"></span></div>
      <div class="table-wrap">
        <table aria-labelledby="results-title" id="results" hidden>
          <colgroup><col class="call"><col class="licence"><col class="name"><col></colgroup>
          <thead><tr><th scope="col">Rufzeichen</th><th scope="col">Klasse</th><th scope="col">Name</th><th scope="col">Ort / PLZ</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="empty">Daten werden geladen &hellip;</p>
      </div>
      <nav class="pagination" aria-label="Ergebnisseiten" id="pagination" hidden>
        <span id="page-label"></span>
        <div class="page-actions">
          <button type="button" id="previous" aria-label="Vorherige Seite" title="Vorherige Seite"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
          <button type="button" id="next" aria-label="N&auml;chste Seite" title="N&auml;chste Seite"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
      </nav>
    </section>
    <footer>Daten auf Basis der öffentlichen Rufzeichenliste der Bundesnetzagentur &middot; <a id="source" href="rufzeichenliste_afu.pdf" target="_blank" rel="noopener">Originale Rufzeichenliste (PDF)</a></footer>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const byId = id => document.getElementById(id);
      const empty = byId('empty');
      if (typeof rufzeichenDaten === 'undefined') {
        empty.textContent = 'Der lokale Datenexport rufzeichen-daten.js fehlt oder konnte nicht geladen werden.';
        return;
      }

      const { stand, quelle, eintraege } = rufzeichenDaten;
      const form = byId('search');
      const query = byId('query');
      const table = byId('results');
      const previous = byId('previous');
      const next = byId('next');
      const pageSize = 25;
      const format = new Intl.NumberFormat('de-DE');
      const fold = value => value.toLowerCase().replace(/\u00df/g, 'ss').normalize('NFD').replace(/\p{M}/gu, '');
      const variants = value => {
        const plain = fold(value);
        const german = fold(value.toLowerCase().replace(/\u00e4/g, 'ae').replace(/\u00f6/g, 'oe').replace(/\u00fc/g, 'ue'));
        return plain === german ? plain : `${plain} ${german}`;
      };
      const collator = new Intl.Collator('de');
      const indexed = eintraege.map(row => ({
        row, call: fold(row[0]), name: variants(row[2]), place: variants(row[3].map(place => place.join(' ')).join(' '))
      })).sort((left, right) => collator.compare(left.call, right.call));
      const source = `./${encodeURIComponent(quelle)}`;
      let matches = null;
      let page = 0;
      let timer;

      byId('edition').textContent = `Stand: ${stand}`;
      byId('overview').textContent = `${format.format(indexed.length)} Eintr\u00e4ge der Bundesnetzagentur`;
      byId('source').href = source;
      form.hidden = false;

      function cell(row, text) {
        const element = row.insertCell();
        element.textContent = text;
        return element;
      }

      function render() {
        const section = byId('results-section');
        const rows = byId('rows');
        section.hidden = matches === null;
        if (matches === null) {
          rows.replaceChildren();
          byId('status').textContent = '';
          return;
        }
        const total = matches.length;
        const first = page * pageSize;
        const last = Math.min(first + pageSize, total);
        const fragment = document.createDocumentFragment();
        for (const { row: [call, licence, name, places, pdfPage] } of matches.slice(first, last)) {
          const row = document.createElement('tr');
          const link = document.createElement('a');
          link.href = `${source}#page=${pdfPage}`;
          link.target = '_blank';
          link.rel = 'noopener';
          link.title = `PDF \u00f6ffnen, Seite ${pdfPage}`;
          link.textContent = call;
          cell(row, '').append(link);
          cell(row, licence);
          cell(row, name);
          const placeCell = cell(row, '');
          if (!places.length) {
            placeCell.textContent = 'Nicht ver\u00f6ffentlicht';
            placeCell.className = 'no-place';
          }
          for (const place of places) {
            const line = document.createElement('div');
            line.textContent = place.join(' ');
            placeCell.append(line);
          }
          fragment.append(row);
        }
        rows.replaceChildren(fragment);
        byId('status').textContent = total === 1 ? '1 Treffer' : `${format.format(total)} Treffer`;
        table.hidden = total === 0;
        empty.hidden = total > 0;
        empty.textContent = 'Keine passenden Eintr\u00e4ge gefunden.';
        byId('pagination').hidden = total === 0;
        byId('page-label').textContent = `${format.format(first + 1)}\u2013${format.format(last)} von ${format.format(total)}`;
        previous.disabled = page === 0;
        next.disabled = last === total;
      }

      function search() {
        clearTimeout(timer);
        const terms = fold(query.value).trim().split(/\s+/).filter(Boolean);
        const mode = new FormData(form).get('mode');
        matches = terms.length === 0 ? null : indexed.filter(entry => terms.every(term => mode === 'all'
          ? entry.call.includes(term) || entry.name.includes(term) || entry.place.includes(term)
          : entry[mode].includes(term)));
        if (terms.length === 1 && (mode === 'all' || mode === 'call')) {
          const exact = matches.filter(entry => entry.call === terms[0]);
          if (exact.length) matches = exact.concat(matches.filter(entry => entry.call !== terms[0]));
        }
        page = 0;
        render();
      }

      query.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(search, 100);
      });
      form.addEventListener('change', search);
      form.addEventListener('submit', event => { event.preventDefault(); search(); });
      previous.addEventListener('click', () => { page -= 1; render(); });
      next.addEventListener('click', () => { page += 1; render(); });
      render();
    });
  </script>
</body>
</html>
